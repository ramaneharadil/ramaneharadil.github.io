<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Raman &amp; Neha — Our World</title>
  <script src="https://unpkg.com/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --panel: 420px; }

    /* ── Loading screen ── */
    #loading {
      position: fixed; inset: 0; z-index: 999;
      background: #060612;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 0;
      transition: opacity 0.8s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    #loading-heart {
      font-size: 2.2rem;
      margin-bottom: 20px;
      animation: heartbeat 1.6s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1);   }
      14%      { transform: scale(1.2); }
      28%      { transform: scale(1);   }
      42%      { transform: scale(1.15);}
      70%      { transform: scale(1);   }
    }

    #loading-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #f5dfa8; letter-spacing: 4px; font-weight: normal;
      margin-bottom: 8px;
    }
    #loading-sub {
      font-size: 0.72rem; color: #7a6a50;
      letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 32px; font-style: italic;
    }

    #loading-bar-wrap {
      width: min(280px, 70vw); height: 2px;
      background: rgba(184,148,106,0.15); border-radius: 1px;
      margin-bottom: 12px; overflow: hidden;
    }
    #loading-bar {
      height: 100%; width: 0%;
      background: linear-gradient(to right, #b8946a, #f5dfa8);
      border-radius: 1px;
      transition: width 0.25s ease;
    }
    #loading-count {
      font-size: 0.6rem; color: rgba(184,148,106,0.4);
      letter-spacing: 2px; text-transform: uppercase;
    }

    #begin-btn {
      display: none;
      margin-top: 32px;
      background: transparent;
      border: 1px solid rgba(184,148,106,0.5);
      color: #f5dfa8;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 13px 36px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      animation: pulse 2s ease-in-out infinite;
    }
    #begin-btn:hover { background: rgba(184,148,106,0.12); border-color: #b8946a; }

    body {
      background: #060612;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      height: 100vh; width: 100vw; color: #fff;
    }

    /* ── Stars ── */
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── Globe ── */
    #globe-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    @media (min-width: 768px) {
      #globe-container { right: var(--panel); }
    }

    /* ── Header ── */
    #header {
      position: fixed; top: 18px; z-index: 10;
      text-align: center; pointer-events: none; white-space: nowrap;
      /* centre within the globe area */
      left: 0;
      right: 0;
    }
    @media (min-width: 768px) {
      #header { right: var(--panel); }
    }
    #header h1 {
      font-size: clamp(1rem, 3vw, 1.6rem); color: #f5dfa8;
      letter-spacing: clamp(2px, 1vw, 4px);
      text-shadow: 0 0 28px rgba(245,223,168,0.35); font-weight: normal;
    }
    #header p {
      color: #b8946a; font-style: italic;
      font-size: clamp(0.58rem, 1.6vw, 0.75rem); margin-top: 4px; letter-spacing: 1px;
    }

    /* ── Music button ── */
    #music-btn {
      position: fixed; top: 72px; left: 16px; z-index: 30;
      background: rgba(12,6,2,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(184,148,106,0.28); border-radius: 30px;
      padding: 7px 14px; cursor: pointer; color: #b8946a;
      font-size: 0.78rem; letter-spacing: 1px;
      display: flex; align-items: center; gap: 7px;
      transition: background 0.2s; -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    #music-btn:hover { background: rgba(12,6,2,0.95); }
    #music-btn .icon { font-size: 0.9rem; }

    /* ── Journey controls ── */
    #journey-controls {
      position: fixed; top: 72px; right: 16px; z-index: 30;
      display: flex; align-items: center; gap: 6px;
      background: rgba(12,6,2,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(184,148,106,0.28); border-radius: 30px;
      padding: 7px 13px;
    }
    @media (min-width: 768px) {
      #music-btn { top: 18px; }
      /* Move controls to top of right panel area */
      #journey-controls {
        top: 18px;
        right: calc(var(--panel) + 14px);
        background: transparent; border: none; backdrop-filter: none; padding: 0;
      }
    }
    .jc-btn {
      background: none; border: none; color: #b8946a; cursor: pointer;
      font-size: 0.85rem; padding: 2px 5px; line-height: 1;
      transition: color 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .jc-btn:hover { color: #f5dfa8; }
    #journey-step { font-size: 0.65rem; color: #7a6a50; letter-spacing: 1px; min-width: 32px; text-align: center; }
    #btn-play { font-size: 1rem; }

    /* ── RIGHT PANEL ── */
    #panel {
      position: fixed; z-index: 20;
      background: rgba(10,5,2,0.97);
      overflow: hidden;

      /* MOBILE: bottom sheet */
      left: 0; right: 0; bottom: -100%;
      height: 48vh;
      border-top: 1px solid rgba(184,148,106,0.22);
      border-radius: 18px 18px 0 0;
      transition: bottom 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #panel.show { bottom: 0; }

    /* DESKTOP: always-visible right sidebar */
    @media (min-width: 768px) {
      #panel {
        top: 0; right: 0; bottom: 0 !important;
        left: auto; width: var(--panel);
        height: 100vh;
        border-top: none; border-left: 1px solid rgba(184,148,106,0.18);
        border-radius: 0;
        transition: none;
      }
    }

    #panel-inner {
      height: 100%; overflow-y: auto; overflow-x: hidden;
      padding: 0 20px 36px;
      scrollbar-width: thin; scrollbar-color: rgba(184,148,106,0.15) transparent;
      -webkit-overflow-scrolling: touch;
    }
    #panel-inner::-webkit-scrollbar { width: 3px; }
    #panel-inner::-webkit-scrollbar-thumb { background: rgba(184,148,106,0.2); border-radius: 2px; }

    /* Drag handle — mobile only */
    #panel-handle {
      width: 36px; height: 4px;
      background: rgba(184,148,106,0.3); border-radius: 2px;
      margin: 10px auto 14px;
    }
    @media (min-width: 768px) { #panel-handle { display: none; } }

    /* Close button — mobile only */
    #panel-close {
      position: sticky; top: 8px; float: right;
      background: rgba(184,148,106,0.1);
      border: 1px solid rgba(184,148,106,0.3); color: #b8946a;
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      font-size: 12px; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; -webkit-tap-highlight-color: transparent;
      margin-bottom: 8px; z-index: 1;
    }
    #panel-close:hover { background: rgba(184,148,106,0.22); }
    @media (min-width: 768px) { #panel-close { display: none; } }

    /* ── Default panel state (desktop welcome) ── */
    #panel-default {
      padding-top: 32px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 6px;
    }
    .pd-heart { font-size: 2rem; margin-bottom: 4px; }
    .pd-names { font-size: 1.35rem; color: #f5dfa8; font-weight: normal; letter-spacing: 2px; }
    .pd-sub   { font-size: 0.68rem; color: #b8946a; letter-spacing: 2px; text-transform: uppercase; font-style: italic; margin-bottom: 16px; }
    .pd-stats {
      display: flex; gap: 20px; justify-content: center;
      margin-bottom: 24px;
    }
    .pd-stat { text-align: center; }
    .pd-stat .num { font-size: 1.6rem; color: #f5dfa8; line-height: 1; }
    .pd-stat .lbl { font-size: 0.55rem; color: #7a6a50; letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }

    .pd-divider {
      width: 100%; height: 1px; background: rgba(184,148,106,0.15); margin-bottom: 20px;
    }
    .pd-hint { font-size: 0.65rem; color: rgba(184,148,106,0.45); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 18px; }

    /* Trip chips in default view */
    .pd-trips { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
    .pd-trip-chip {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 10px; cursor: pointer;
      background: rgba(184,148,106,0.06); border: 1px solid rgba(184,148,106,0.12);
      transition: background 0.18s, border-color 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .pd-trip-chip:hover { background: rgba(184,148,106,0.14); border-color: rgba(184,148,106,0.35); }
    .pd-chip-thumb {
      width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
      border: 1.5px solid rgba(184,148,106,0.2);
    }
    .pd-chip-flag { width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: rgba(184,148,106,0.08); border: 1.5px solid rgba(184,148,106,0.15); }
    .pd-chip-info { flex: 1; min-width: 0; }
    .pd-chip-name { font-size: 0.82rem; color: #f5dfa8; }
    .pd-chip-date { font-size: 0.6rem; color: #6a5a3a; margin-top: 2px; }
    .pd-chip-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Active trip panel content ── */
    .c-flag     { font-size: 2rem; display: block; margin-bottom: 5px; }
    .c-occasion { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #b8946a; margin-bottom: 4px; }
    .c-name     { font-size: clamp(1.1rem, 2.5vw, 1.4rem); color: #f5dfa8; font-weight: normal; margin-bottom: 3px; }
    .c-route    { font-size: 0.68rem; color: #6a5a3a; font-style: italic; margin-bottom: 13px; }
    .c-story    { font-size: 0.83rem; color: #cbbfa8; line-height: 1.72; margin-bottom: 16px; }
    .c-section  {
      font-size: 0.56rem; letter-spacing: 2.5px; text-transform: uppercase;
      color: #7a6a50; margin-bottom: 10px;
      padding-top: 12px; border-top: 1px solid rgba(184,148,106,0.15);
    }

    /* MOBILE: horizontal photo strip */
    .photo-strip {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: thin; scrollbar-color: rgba(184,148,106,0.2) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .photo-strip::-webkit-scrollbar { height: 3px; }
    .photo-strip::-webkit-scrollbar-thumb { background: rgba(184,148,106,0.25); border-radius: 2px; }
    .strip-photo {
      flex-shrink: 0; height: 105px; width: auto; border-radius: 9px;
      cursor: pointer; object-fit: cover; display: block;
      transition: transform 0.22s, filter 0.22s;
      filter: brightness(0.9) saturate(1.05);
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }
    .strip-photo:hover { transform: scale(1.04); filter: brightness(1.05) saturate(1.12); }

    /* DESKTOP: masonry photo grid */
    @media (min-width: 768px) {
      .photo-strip {
        display: block;
        columns: 2; column-gap: 7px;
        overflow: visible; padding: 0;
      }
      .strip-photo {
        display: block; width: 100%; height: auto;
        margin-bottom: 7px; flex-shrink: unset;
        break-inside: avoid;
      }
      .strip-photo:hover { transform: scale(1.02); }
    }

    /* ── Desktop panel top bar ── */
    #panel-topbar {
      display: none;
      padding: 22px 20px 14px;
      border-bottom: 1px solid rgba(184,148,106,0.12);
      margin-bottom: 0;
      position: sticky; top: 0; z-index: 5;
      background: rgba(10,5,2,0.97);
    }
    #panel-topbar h2 { font-size: 0.95rem; color: #f5dfa8; font-weight: normal; letter-spacing: 2px; }
    #panel-topbar p  { font-size: 0.58rem; color: #7a6a50; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
    @media (min-width: 768px) { #panel-topbar { display: block; } }

    /* ── Globe photo pins ── */
    .globe-pin {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2.5px solid #fff; overflow: hidden; cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.7);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative; background: #1a0d04;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .globe-pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .globe-pin .pin-flag { font-size: 1.2rem; }
    .globe-pin:hover, .globe-pin.active {
      transform: scale(1.22);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 0 3px rgba(255,255,255,0.45);
    }
    .pin-pulse {
      position: absolute; inset: -6px; border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0; pointer-events: none;
    }
    /* Only pulse the active pin */
    .globe-pin.active .pin-pulse {
      animation: pinpulse 2s ease-out infinite;
      opacity: 1;
    }
    @keyframes pinpulse { 0%{transform:scale(0.85);opacity:.8} 100%{transform:scale(1.6);opacity:0} }

    /* ── Progress bar ── */
    #progress-bar { position: fixed; bottom: 0; left: 0; z-index: 25; height: 2px; background: rgba(184,148,106,0.1); right: 0; }
    @media (min-width: 768px) { #progress-bar { right: var(--panel); } }
    #progress-fill { height: 100%; background: linear-gradient(to right, #b8946a, #f5dfa8); width: 0%; }

    /* ── Now playing ── */
    #now-playing {
      position: fixed; bottom: 7px; z-index: 26; pointer-events: none;
      font-size: 0.58rem; color: rgba(184,148,106,0.45);
      letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;
      left: 50%;  transform: translateX(-50%);
    }
    @media (min-width: 768px) {
      #now-playing { left: 0; right: var(--panel); transform: none; text-align: center; }
    }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      color: rgba(184,148,106,0.5); font-size: 0.65rem;
      letter-spacing: 2px; z-index: 10; pointer-events: none;
      animation: pulse 3s ease-in-out infinite; white-space: nowrap;
    }
    @media (min-width: 768px) {
      #hint { left: 0; right: var(--panel); transform: none; text-align: center; }
    }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    #lightbox.show { display: flex; }
    #lightbox img { max-width: 96vw; max-height: 90vh; border-radius: 6px; object-fit: contain; box-shadow: 0 0 60px rgba(0,0,0,0.9); }
    #lb-close { position: fixed; top: 14px; right: 18px; color: #b8946a; font-size: 2rem; cursor: pointer; z-index: 201; line-height: 1; }
  </style>
</head>
<body>

<!-- Background music -->
<audio id="bg-music" loop preload="auto">
  <source src="song/mere-bina.opus" type="audio/ogg; codecs=opus">
  <source src="song/mere-bina.m4a" type="audio/mp4">
</audio>

<!-- Loading screen -->
<div id="loading">
  <div id="loading-heart">❤️</div>
  <div id="loading-title">Raman &amp; Neha</div>
  <div id="loading-sub">Loading your journey</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-count">0 / 46</div>
  <button id="begin-btn" onclick="beginJourney()">✦ Begin ✦</button>
</div>

<canvas id="stars"></canvas>
<div id="globe-container"></div>

<div id="header">
  <h1>Raman &amp; Neha</h1>
  <p>A love story told in miles &amp; memories</p>
</div>

<!-- Music toggle -->
<button id="music-btn" onclick="toggleMusic()">
  <span class="icon" id="music-icon">🔇</span>
  <span id="music-label">Play Music</span>
</button>

<!-- Journey controls -->
<div id="journey-controls">
  <button class="jc-btn" id="btn-prev" onclick="journeyStep(-1)" title="Previous">◀</button>
  <span id="journey-step">1 / 9</span>
  <button class="jc-btn" id="btn-play" onclick="togglePlay()" title="Play/Pause">⏸</button>
  <button class="jc-btn" id="btn-next" onclick="journeyStep(1)" title="Next">▶</button>
</div>

<!-- Single panel: right sidebar on desktop, bottom sheet on mobile -->
<div id="panel">
  <!-- desktop top bar -->
  <div id="panel-topbar">
    <h2>Raman &amp; Neha</h2>
    <p>Our world journey</p>
  </div>

  <div id="panel-inner">
    <div id="panel-handle"></div>
    <button id="panel-close" onclick="closePanel()">✕</button>
    <div id="panel-content">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="now-playing"></div>
<div id="hint">✦ &nbsp;Starting your journey…&nbsp; ✦</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lb-close">×</span>
  <img id="lb-img" src="" alt="">
</div>

    story: 'Universal Studios Hollywood, a wildflower meadow hike with mountain views, then across to the Brooklyn Bridge in New York. Two coasts, one birthday. LA showed off, New York delivered.',
    photos: ['photos/usa-1/IMG_0832.jpg','photos/usa-1/IMG_1246.jpg','photos/usa-1/IMG_8771.jpg','photos/usa-1/IMG_9908.jpg','photos/usa-1/FullSizeRender.jpg','photos/usa-1/IMG_1061.jpg'],
  },
  {
    id: 'japan', name: 'Japan', location: 'Japan', date: 'November 2025',
    lat: 35.6762, lng: 139.6503,
    originName: 'Bengaluru', originLat: 12.9716, originLng: 77.5946,
    occasion: '🍁 Autumn in Japan', flag: '🇯🇵', color: '#e8a0bf',
    story: 'They dressed in kimono and walked under Kyoto\'s red torii gates, paper parasol in hand. The autumn garden — maples ablaze, a still pond, stepping stones — looked like a painting. Japan dressed them in its culture and they never wanted to take it off.',
    photos: ['photos/japan/027A6146.jpeg','photos/japan/IMG_0488.jpeg','photos/japan/IMG_0746.jpeg','photos/japan/IMG_1257.jpeg','photos/japan/IMG_1532.jpeg','photos/japan/IMG_1953.jpeg','photos/japan/IMG_2615.jpeg','photos/japan/IMG_2864.jpeg','photos/japan/IMG_3351.jpeg','photos/japan/IMG_3618.jpeg','photos/japan/IMG_4114.jpeg','photos/japan/IMG_5447.jpeg'],
  },
  {
    id: 'usa-2', name: 'San Francisco', location: 'San Francisco, USA', date: 'July 2026',
    lat: 37.7749, lng: -122.4194,
    originName: 'Bengaluru', originLat: 12.9716, originLng: 77.5946,
    occasion: '🌉 Quick Getaway', flag: '🇺🇸', color: '#f7b731',
    story: 'A kiss on a colourful California beach, then the Golden Gate Bridge in brilliant sunshine. A gentle trip, a slower pace. This time, there were three of you.',
    photos: ['photos/usa-2/IMG_8499.jpeg','photos/usa-2/IMG_8935.jpeg','photos/usa-2/IMG_9333.jpeg','photos/usa-2/IMG_9757.jpeg','photos/usa-2/IMG_0332.jpeg'],
  },
];

const ARCS = TRIPS.map(t => ({
  startLat: t.originLat, startLng: t.originLng,
  endLat: t.lat, endLng: t.lng,
  color: ['rgba(255,255,255,0.4)', t.color + 'cc'],
}));

const HOME_CITIES = [
  { name: 'Chandigarh', lat: 30.7333, lng: 76.7794 },
  { name: 'Hyderabad',  lat: 17.3850, lng: 78.4867 },
  { name: 'Bengaluru',  lat: 12.9716, lng: 77.5946 },
];

// ── Helpers ───────────────────────────────────────────────────
const isDesktop = () => window.innerWidth >= 768;
const PANEL_W = 420;

function globeWidth() { return isDesktop() ? window.innerWidth - PANEL_W : window.innerWidth; }

// ── Starfield ─────────────────────────────────────────────────
(function(){
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  for(let i=0;i<300;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*1.2, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${0.2+Math.random()*0.8})`; ctx.fill();
  }
  window.addEventListener('resize',()=>{ c.width=innerWidth; c.height=innerHeight; });
})();

// ── Globe ──────────────────────────────────────────────────────
const globe = Globe()
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl(null)
  .backgroundImageUrl(null)
  .backgroundColor('rgba(0,0,0,0)')
  .width(globeWidth()).height(window.innerHeight)
  .htmlElementsData(TRIPS)
  .htmlLat('lat').htmlLng('lng').htmlAltitude(0.06)
  .htmlElement(d => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'pointer-events:auto;';
    const pin = document.createElement('div');
    pin.className = 'globe-pin';
    pin.style.borderColor = d.color;
    pin.setAttribute('data-id', d.id);
    const pulse = document.createElement('div');
    pulse.className = 'pin-pulse'; pulse.style.color = d.color;
    if (d.photos[0]) {
      const img = document.createElement('img'); img.src = d.photos[0]; img.alt = d.name;
      pin.appendChild(img);
    } else {
      const f = document.createElement('span'); f.className = 'pin-flag'; f.textContent = d.flag;
      pin.appendChild(f);
    }
    pin.appendChild(pulse); wrap.appendChild(pin);
    wrap.addEventListener('click', e => { e.stopPropagation(); pauseJourney(); flyToTrip(d, true); });
    return wrap;
  })
  .pointsData(HOME_CITIES)
  .pointLat('lat').pointLng('lng')
  .pointColor(() => 'rgba(255,255,255,0.65)')
  .pointRadius(0.24).pointAltitude(0.005)
  .pointLabel(d => `<div style="background:rgba(10,5,2,0.88);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:5px 10px;font-family:Georgia,serif;font-size:0.72rem;color:#f5dfa8;">${d.name}</div>`)
  .arcsData(ARCS)
  .arcStartLat('startLat').arcStartLng('startLng')
  .arcEndLat('endLat').arcEndLng('endLng')
  .arcColor('color').arcStroke(0.28)
  .arcDashLength(0.4).arcDashGap(0.15).arcDashAnimateTime(6000)
  .arcAltitudeAutoScale(0.35)
  (document.getElementById('globe-container'));

globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.25;
globe.controls().enableDamping = true;

window.addEventListener('resize', () => {
  globe.width(globeWidth()).height(window.innerHeight);
});

// ── Panel content ─────────────────────────────────────────────
function renderDefault() {
  const chips = TRIPS.map(t => {
    const thumb = t.photos[0]
      ? `<img class="pd-chip-thumb" src="${t.photos[0]}" alt="${t.name}" loading="lazy">`
      : `<div class="pd-chip-flag">${t.flag}</div>`;
    return `<div class="pd-trip-chip" onclick="pauseJourney(); flyToTrip(TRIPS.find(x=>x.id==='${t.id}'), true)">
      ${thumb}
      <div class="pd-chip-info">
        <div class="pd-chip-name">${t.flag} ${t.name}</div>
        <div class="pd-chip-date">${t.date} · ${t.occasion}</div>
      </div>
      <div class="pd-chip-dot" style="background:${t.color}"></div>
    </div>`;
  }).join('');

  document.getElementById('panel-content').innerHTML = `
    <div id="panel-default">
      <div class="pd-heart">❤️</div>
      <div class="pd-names">Raman &amp; Neha</div>
      <div class="pd-sub">Our world journey</div>
      <div class="pd-stats">
        <div class="pd-stat"><div class="num">9</div><div class="lbl">Trips</div></div>
        <div class="pd-stat"><div class="num">5</div><div class="lbl">Years</div></div>
        <div class="pd-stat"><div class="num">14</div><div class="lbl">Countries</div></div>
      </div>
      <div class="pd-divider"></div>
      <div class="pd-hint">✦ tap a destination ✦</div>
      <div class="pd-trips">${chips}</div>
    </div>
  `;
}

function showTripPanel(trip) {
  document.querySelectorAll('.globe-pin').forEach(p => p.classList.remove('active'));
  const pin = document.querySelector(`.globe-pin[data-id="${trip.id}"]`);
  if (pin) pin.classList.add('active');

  const photos = trip.photos.map((src,i) =>
    `<img class="strip-photo" src="${src}" alt="${i+1}" loading="lazy" onclick="openLightbox('${src}')">`
  ).join('');

  document.getElementById('panel-content').innerHTML = `
    <span class="c-flag">${trip.flag}</span>
    <div class="c-occasion">${trip.occasion}</div>
    <div class="c-name">${trip.name}</div>
    <div class="c-route">${trip.date} &nbsp;·&nbsp; ${trip.originName} → ${trip.location}</div>
    <div class="c-story">${trip.story}</div>
    <div class="c-section">Photos</div>
    <div class="photo-strip">${photos}</div>
    <div style="margin-top:18px;">
      <span onclick="closePanel()" style="font-size:0.62rem;color:#6a5a3a;cursor:pointer;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid rgba(184,148,106,0.2);padding-bottom:1px;">
        ← Back to all trips
      </span>
    </div>
  `;

  // On desktop panel is always visible; on mobile slide it up
  if (!isDesktop()) {
    document.getElementById('panel').classList.add('show');
  }
  document.getElementById('panel-inner').scrollTop = 0;
  document.getElementById('hint').style.display = 'none';
  document.getElementById('journey-step').textContent = `${currentIndex + 1} / ${TRIPS.length}`;
}

function closePanel() {
  if (!isDesktop()) document.getElementById('panel').classList.remove('show');
  document.querySelectorAll('.globe-pin').forEach(p => p.classList.remove('active'));
  renderDefault();
  if (!isDesktop()) document.getElementById('hint').style.display = 'block';
  globe.controls().autoRotate = true;
}

// ── Journey player ─────────────────────────────────────────────
let currentIndex = 0;
let playing = true;
let stepTimer = null;
const STEP_DURATION = 7000;

function flyToTrip(trip, openPanel) {
  globe.controls().autoRotate = false;
  // Fly to origin first
  globe.pointOfView({ lat: trip.originLat, lng: trip.originLng, altitude: 2.8 }, 900);

  setTimeout(() => {
    // Fly to destination; on desktop shift globe view left so destination shows in globe area
    const latShift  = isDesktop() ? 0  : 10;
    const lngShift  = isDesktop() ? -15 : 0;
    globe.pointOfView({ lat: trip.lat - latShift, lng: trip.lng + lngShift, altitude: 1.85 }, 1800);
    if (openPanel) setTimeout(() => showTripPanel(trip), 1900);
  }, 1100);
}

function playStep(index) {
  if (index >= TRIPS.length) index = 0;
  currentIndex = index;
  const trip = TRIPS[index];
  document.getElementById('now-playing').textContent = `${trip.originName}  →  ${trip.name}`;
  flyToTrip(trip, true);

  // Progress bar
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => {
    const total = STEP_DURATION + 3100;
    fill.style.transition = `width ${total}ms linear`;
    fill.style.width = '100%';
  });

  stepTimer = setTimeout(() => { if (playing) playStep(currentIndex + 1); }, STEP_DURATION + 3100);
}

function pauseJourney() {
  playing = false; clearTimeout(stepTimer);
  document.getElementById('btn-play').textContent = '▶';
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none'; fill.style.width = '0%';
}

function resumeJourney() {
  playing = true;
  document.getElementById('btn-play').textContent = '⏸';
  playStep(currentIndex);
}

function togglePlay() { if (playing) pauseJourney(); else resumeJourney(); }

function journeyStep(dir) {
  clearTimeout(stepTimer);
  currentIndex = Math.max(0, Math.min(TRIPS.length - 1, currentIndex + dir));
  playing = true;
  document.getElementById('btn-play').textContent = '⏸';
  playStep(currentIndex);
}

// Swipe-down to close on mobile
let touchStartY = 0;
document.getElementById('panel').addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
document.getElementById('panel').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 70 && document.getElementById('panel-inner').scrollTop === 0) {
    closePanel(); pauseJourney();
  }
}, { passive: true });

// ── Lightbox ───────────────────────────────────────────────────
function openLightbox(src) { document.getElementById('lb-img').src = src; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox()    { document.getElementById('lightbox').classList.remove('show'); document.getElementById('lb-img').src = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── Music ─────────────────────────────────────────────────────
const audio = document.getElementById('bg-music');
audio.volume = 0.35;
let musicPlaying = false;

function startMusic() {
  audio.play().then(() => {
    musicPlaying = true;
    document.getElementById('music-icon').textContent  = '🎵';
    document.getElementById('music-label').textContent = 'Mere Bina';
  }).catch(() => {});
}

function toggleMusic() {
  if (musicPlaying) {
    audio.pause();
    musicPlaying = false;
    document.getElementById('music-icon').textContent  = '🔇';
    document.getElementById('music-label').textContent = 'Play Music';
  } else {
    startMusic();
  }
}

// ── Init / preloader ──────────────────────────────────────────
renderDefault();

const ALL_PHOTOS = TRIPS.flatMap(t => t.photos);
const TOTAL      = ALL_PHOTOS.length;
let loadedCount  = 0;
let globeReady   = false;

function updateProgress() {
  const pct = Math.round((loadedCount / TOTAL) * 100);
  document.getElementById('loading-bar').style.width   = pct + '%';
  document.getElementById('loading-count').textContent = `${loadedCount} / ${TOTAL} photos`;
}

function onAllReady() {
  if (!globeReady || loadedCount < TOTAL) return;
  // Everything loaded — show Begin button
  setTimeout(() => {
    document.getElementById('loading-count').style.display = 'none';
    document.getElementById('loading-bar-wrap').style.display = 'none';
    document.getElementById('loading-sub').textContent = 'Ready';
    document.getElementById('begin-btn').style.display = 'block';
  }, 300);
}

function beginJourney() {
  const el = document.getElementById('loading');
  el.classList.add('fade-out');
  setTimeout(() => { el.style.display = 'none'; }, 850);
  document.getElementById('hint').style.display = 'none';
  startMusic();
  playStep(0);
}

// Preload all photos
ALL_PHOTOS.forEach(src => {
  const img = new Image();
  img.onload = img.onerror = () => {
    loadedCount++;
    updateProgress();
    onAllReady();
  };
  img.src = src;
});

// Globe texture ready
globe.onGlobeReady(() => {
  globeReady = true;
  onAllReady();
});
</script>
</body>
</html>
