<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Raman &amp; Neha — Our World</title>
  <script src="https://unpkg.com/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060612;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      height: 100vh; width: 100vw;
      color: #fff;
    }

    /* ── Stars ── */
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── Globe always full screen ── */
    #globe-container { position: fixed; inset: 0; z-index: 1; }

    /* ── Header ── */
    #header {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; pointer-events: none; white-space: nowrap;
    }
    #header h1 {
      font-size: clamp(1rem, 3.5vw, 1.7rem); color: #f5dfa8;
      letter-spacing: clamp(2px, 1vw, 4px);
      text-shadow: 0 0 28px rgba(245,223,168,0.35); font-weight: normal;
    }
    #header p {
      color: #b8946a; font-style: italic;
      font-size: clamp(0.6rem, 1.8vw, 0.78rem); margin-top: 4px; letter-spacing: 1px;
    }

    /* ── Journey controls (top-right) ── */
    #journey-controls {
      position: fixed; top: 18px; right: 16px; z-index: 30;
      display: flex; align-items: center; gap: 6px;
      background: rgba(12,6,2,0.82); backdrop-filter: blur(10px);
      border: 1px solid rgba(184,148,106,0.28); border-radius: 30px;
      padding: 8px 14px;
    }
    .jc-btn {
      background: none; border: none; color: #b8946a; cursor: pointer;
      font-size: 0.85rem; padding: 2px 4px; line-height: 1;
      transition: color 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .jc-btn:hover { color: #f5dfa8; }
    #journey-step {
      font-size: 0.68rem; color: #7a6a50; letter-spacing: 1px;
      min-width: 32px; text-align: center;
    }
    #btn-play { font-size: 1rem; }

    /* ── Trip card — always bottom sheet, globe stays visible above ── */
    #card {
      position: fixed;
      left: 0; right: 0; bottom: -100%;
      z-index: 20;
      /* max-width so it doesn't stretch too wide on big screens */
      max-width: 560px;
      margin: 0 auto;
      height: 46vh;
      background: rgba(12,6,2,0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(184,148,106,0.25);
      border-radius: 18px 18px 0 0;
      overflow: hidden;
      pointer-events: auto;
      transition: bottom 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #card.show { bottom: 0; }

    #card-inner {
      height: 100%; overflow-y: auto; overflow-x: hidden;
      padding: 0 20px 28px;
      scrollbar-width: thin; scrollbar-color: rgba(184,148,106,0.2) transparent;
      -webkit-overflow-scrolling: touch;
    }

    #card-close {
      position: sticky; top: 8px; float: right;
      background: rgba(184,148,106,0.1);
      border: 1px solid rgba(184,148,106,0.3); color: #b8946a;
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      font-size: 12px; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; -webkit-tap-highlight-color: transparent;
      margin-bottom: 8px; z-index: 1; flex-shrink: 0;
    }
    #card-close:hover { background: rgba(184,148,106,0.25); }

    /* Drag handle */
    #card-handle {
      width: 36px; height: 4px;
      background: rgba(184,148,106,0.3); border-radius: 2px;
      margin: 10px auto 14px;
    }

    .c-flag     { font-size: 2.2rem; display: block; margin-bottom: 6px; }
    .c-occasion { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #b8946a; margin-bottom: 5px; }
    .c-name     { font-size: clamp(1.1rem, 3vw, 1.45rem); color: #f5dfa8; font-weight: normal; margin-bottom: 3px; }
    .c-route    { font-size: 0.72rem; color: #6a5a3a; font-style: italic; margin-bottom: 14px; }
    .c-story    { font-size: clamp(0.78rem, 2.2vw, 0.87rem); color: #cbbfa8; line-height: 1.72; margin-bottom: 18px; }

    .c-section  {
      font-size: 0.58rem; letter-spacing: 2.5px; text-transform: uppercase;
      color: #7a6a50; margin-bottom: 10px;
      padding-top: 14px; border-top: 1px solid rgba(184,148,106,0.15);
    }

    /* ── Horizontal photo strip ── */
    .photo-strip {
      display: flex; gap: 8px;
      overflow-x: auto; overflow-y: hidden;
      padding-bottom: 6px;
      scrollbar-width: thin; scrollbar-color: rgba(184,148,106,0.2) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .photo-strip::-webkit-scrollbar { height: 3px; }
    .photo-strip::-webkit-scrollbar-track { background: transparent; }
    .photo-strip::-webkit-scrollbar-thumb { background: rgba(184,148,106,0.3); border-radius: 2px; }

    .strip-photo {
      flex-shrink: 0;
      height: 130px; width: auto;
      border-radius: 9px;
      cursor: pointer;
      object-fit: cover;
      transition: transform 0.25s, filter 0.25s;
      filter: brightness(0.9) saturate(1.05);
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      display: block;
    }
    .strip-photo:hover { transform: scale(1.04); filter: brightness(1.05) saturate(1.15); }
    @media (max-width: 599px) { .strip-photo { height: 100px; } }

    /* ── Globe photo pins ── */
    .globe-pin {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2.5px solid #fff; overflow: hidden; cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.7);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative; background: #1a0d04;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .globe-pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .globe-pin .pin-flag { font-size: 1.3rem; }
    .globe-pin:hover, .globe-pin.active {
      transform: scale(1.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 0 3px rgba(255,255,255,0.5);
    }
    .pin-pulse {
      position: absolute; inset: -6px; border-radius: 50%;
      border: 2px solid currentColor;
      animation: pinpulse 2.2s ease-out infinite; pointer-events: none;
    }
    @keyframes pinpulse { 0%{transform:scale(0.85);opacity:.8} 100%{transform:scale(1.6);opacity:0} }

    /* ── Journey progress bar ── */
    #progress-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
      background: rgba(184,148,106,0.12); z-index: 25;
    }
    #progress-fill {
      height: 100%; background: linear-gradient(to right, #b8946a, #f5dfa8);
      transition: width 0.3s linear; width: 0%;
    }

    /* ── Now playing label ── */
    #now-playing {
      position: fixed; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem; color: rgba(184,148,106,0.5);
      letter-spacing: 2px; text-transform: uppercase;
      z-index: 26; pointer-events: none; white-space: nowrap;
      transition: opacity 0.4s;
    }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(184,148,106,0.55); font-size: clamp(0.58rem, 1.8vw, 0.7rem);
      letter-spacing: 2px; z-index: 10; pointer-events: none;
      animation: pulse 3s ease-in-out infinite; white-space: nowrap;
    }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 96vw; max-height: 90vh;
      border-radius: 6px; box-shadow: 0 0 60px rgba(0,0,0,0.9); object-fit: contain;
    }
    #lb-close {
      position: fixed; top: 14px; right: 18px;
      color: #b8946a; font-size: 2rem; cursor: pointer; line-height: 1; z-index: 201;
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="globe-container"></div>

<div id="header">
  <h1>Raman &amp; Neha</h1>
  <p>A love story told in miles &amp; memories</p>
</div>

<!-- Journey controls -->
<div id="journey-controls">
  <button class="jc-btn" id="btn-prev" title="Previous" onclick="journeyStep(-1)">◀</button>
  <span id="journey-step">1 / 9</span>
  <button class="jc-btn" id="btn-play" title="Play/Pause" onclick="togglePlay()">⏸</button>
  <button class="jc-btn" id="btn-next" title="Next" onclick="journeyStep(1)">▶</button>
</div>

<!-- Trip card (left on desktop, bottom on mobile) -->
<div id="card">
  <div id="card-inner">
    <div id="card-handle"></div>
    <button id="card-close" onclick="closeCard()">✕</button>
    <div id="card-content"></div>
  </div>
</div>

<!-- Progress bar -->
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="now-playing"></div>

<!-- Hint (shown before journey starts) -->
<div id="hint">✦ &nbsp;Starting your journey…&nbsp; ✦</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lb-close">×</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
// ════════════════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════════════════
const TRIPS = [
  {
    id: 'dubai', name: 'Dubai', location: 'Dubai, UAE', date: 'December 2021',
    lat: 25.2048, lng: 55.2708,

    occasion: '🌹 Honeymoon', flag: '🇦🇪', color: '#f4c842',

    photos: ['photos/dubai/1.jpeg','photos/dubai/2.jpg','photos/dubai/3.jpg'],
  },
  {
    id: 'australia', name: 'Australia', location: 'Australia', date: 'November 2022',
    lat: -33.8688, lng: 151.2093,
    originName: 'Hyderabad', originLat: 17.3850, originLng: 78.4867,
    occasion: '🥂 1st Anniversary', flag: '🇦🇺', color: '#ff6b35',
    story: 'One year in, and we were already chasing the other side of the world. The Opera House, Bondi Beach at dawn, kangaroos at sunrise — Australia was as wild and big-hearted as our love.',
    photos: ['photos/australia/1.jpeg','photos/australia/2.jpg','photos/australia/3.jpeg','photos/australia/4.jpeg','photos/australia/5.jpg'],
  },
  {
    id: 'thailand-1', name: 'Thailand', location: 'Thailand', date: 'November 2023',
    lat: 7.9519, lng: 98.3381,
    originName: 'Hyderabad', originLat: 17.3850, originLng: 78.4867,
    occasion: '🥂 2nd Anniversary', flag: '🇹🇭', color: '#f4a0c0',
    story: 'Two years in, and we found ourselves in paradise. Golden temples in morning mist, longtail boats on emerald water, street food that made us forget the whole world existed.',
    photos: ['photos/thailand/IMG_0448.jpeg','photos/thailand/IMG_3848.jpg','photos/thailand/IMG_3437.jpg','photos/thailand/IMG_3574.jpg','photos/thailand/IMG_1259.jpg'],
  },
  {
    id: 'spain', name: 'Spain', location: 'Spain', date: 'June 2024',
    lat: 40.4168, lng: -3.7038,
    originName: 'Hyderabad', originLat: 17.3850, originLng: 78.4867,
    occasion: '✈️ Summer Escape', flag: '🇪🇸', color: '#e63946',
    story: 'Sangria under the Spanish sun, Gaudí\'s impossible architecture, flamenco echoing through cobblestone streets at midnight. Spain didn\'t just steal our hearts — it danced with them.',
    photos: ['photos/spain/IMG_9095.jpg','photos/spain/IMG_9259.jpg','photos/spain/IMG_9756.jpg'],
  },
  {
    id: 'switzerland', name: 'Switzerland', location: 'Switzerland', date: 'July 2024',
    lat: 46.8182, lng: 8.2275,
    originName: 'Hyderabad', originLat: 17.3850, originLng: 78.4867,
    occasion: '⛰️ Alpine Adventure', flag: '🇨🇭', color: '#4ecdc4',
    story: 'From Spanish heat to Alpine cool in one summer. Snow-capped peaks, Swiss chocolate, train rides through scenery that looked too perfect to be real.',
    photos: ['photos/switzerland/IMG_0006.jpg','photos/switzerland/IMG_0573.jpg','photos/switzerland/IMG_9873.jpg','photos/switzerland/IMG_1156.jpeg'],
  },
  {
    id: 'thailand-2', name: 'Thailand Again', location: 'Thailand', date: 'July 2025',
    lat: 13.7563, lng: 100.5018,
    originName: 'Bengaluru', originLat: 12.9716, originLng: 77.5946,
    occasion: '🌴 Return to Paradise', flag: '🇹🇭', color: '#a8dadc',
    story: 'Some places call you back. Thailand pulled us in again — new corners, new temples, new flavors. Familiar magic, completely fresh wonder.',
    photos: ['photos/thailand-2/GOPR2506.jpeg','photos/thailand-2/IMG_8953.jpeg','photos/thailand-2/IMG_9020.jpeg'],
  },
  {
    id: 'usa-1', name: 'LA & New York', location: 'Los Angeles & New York, USA', date: 'August 2025',
    lat: 36.7783, lng: -100.4179,
    originName: 'Bengaluru', originLat: 12.9716, originLng: 77.5946,
    occasion: '🎂 Her Birthday', flag: '🇺🇸', color: '#b17be8',
    story: 'City of Angels to the City that Never Sleeps — all for her birthday. Sunset boulevards in LA, Times Square blazing at midnight in New York. The whole country felt like it was celebrating her.',
    photos: ['photos/usa-1/IMG_0832.jpg','photos/usa-1/IMG_1246.jpg','photos/usa-1/IMG_8771.jpg','photos/usa-1/IMG_9908.jpg','photos/usa-1/FullSizeRender.jpg','photos/usa-1/IMG_1061.jpg'],
  },
  {
    id: 'japan', name: 'Japan', location: 'Japan', date: 'November 2025',
    lat: 35.6762, lng: 139.6503,
    originName: 'Bengaluru', originLat: 12.9716, originLng: 77.5946,
    occasion: '🍁 Autumn in Japan', flag: '🇯🇵', color: '#e8a0bf',
    story: 'Autumn leaves falling on Kyoto shrines, ramen at 2am in Tokyo, deer bowing in Nara. Japan was a dream we didn\'t know we needed — precise, beautiful, utterly unlike anywhere else.',
    photos: ['photos/japan/027A6146.jpeg','photos/japan/IMG_0488.jpeg','photos/japan/IMG_0746.jpeg','photos/japan/IMG_1257.jpeg','photos/japan/IMG_1532.jpeg','photos/japan/IMG_1953.jpeg','photos/japan/IMG_2615.jpeg','photos/japan/IMG_2864.jpeg','photos/japan/IMG_3351.jpeg','photos/japan/IMG_3618.jpeg','photos/japan/IMG_4114.jpeg','photos/japan/IMG_5447.jpeg'],
  },
  {
    id: 'usa-2', name: 'San Francisco', location: 'San Francisco, USA', date: 'July 2026',
    lat: 37.7749, lng: -122.4194,
    originName: 'Bengaluru', originLat: 12.9716, originLng: 77.5946,
    occasion: '🌉 Quick Getaway', flag: '🇺🇸', color: '#f7b731',
    story: 'A spontaneous SFO run — Golden Gate in the morning fog, clam chowder at Fisherman\'s Wharf, and the reminder that any city is more beautiful when you\'re together.',
    photos: ['photos/usa-2/IMG_8499.jpeg','photos/usa-2/IMG_8935.jpeg','photos/usa-2/IMG_9333.jpeg','photos/usa-2/IMG_9757.jpeg','photos/usa-2/IMG_0332.jpeg'],
  },
];

const ARCS = TRIPS.map(t => ({
  startLat: t.originLat, startLng: t.originLng,
  endLat: t.lat, endLng: t.lng,
  color: ['rgba(255,255,255,0.45)', t.color + 'cc'],
}));

const HOME_CITIES = [
  { name: 'Chandigarh', lat: 30.7333, lng: 76.7794 },
  { name: 'Hyderabad',  lat: 17.3850, lng: 78.4867 },
  { name: 'Bengaluru',  lat: 12.9716, lng: 77.5946 },
];

// ── Starfield ─────────────────────────────────────────────────
(function(){
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  for(let i=0;i<300;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*1.2, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${0.2+Math.random()*0.8})`; ctx.fill();
  }
  window.addEventListener('resize',()=>{ c.width=innerWidth; c.height=innerHeight; });
})();

// ── Globe ──────────────────────────────────────────────────────
let activePinEl = null;

const globe = Globe()
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl(null)
  .backgroundColor('rgba(0,0,0,0)')
  .htmlElementsData(TRIPS)
  .htmlLat('lat').htmlLng('lng').htmlAltitude(0.06)
  .htmlElement(d => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'pointer-events:auto;';
    const pin = document.createElement('div');
    pin.className = 'globe-pin';
    pin.style.borderColor = d.color;
    pin.setAttribute('data-id', d.id);
    const pulse = document.createElement('div');
    pulse.className = 'pin-pulse'; pulse.style.color = d.color;
    const firstPhoto = d.photos[0];
    if (firstPhoto) {
      const img = document.createElement('img'); img.src = firstPhoto; img.alt = d.name;
      pin.appendChild(img);
    } else {
      const f = document.createElement('span'); f.className = 'pin-flag'; f.textContent = d.flag;
      pin.appendChild(f);
    }
    pin.appendChild(pulse); wrap.appendChild(pin);
    wrap.addEventListener('click', e => {
      e.stopPropagation();
      pauseJourney();
      flyToTrip(d, true);
    });
    return wrap;
  })
  .pointsData(HOME_CITIES)
  .pointLat('lat').pointLng('lng')
  .pointColor(() => 'rgba(255,255,255,0.7)')
  .pointRadius(0.25).pointAltitude(0.005)
  .pointLabel(d => `<div style="background:rgba(10,5,2,0.88);border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:5px 10px;font-family:Georgia,serif;font-size:0.72rem;color:#f5dfa8;">${d.name}</div>`)
  .arcsData(ARCS)
  .arcStartLat('startLat').arcStartLng('startLng')
  .arcEndLat('endLat').arcEndLng('endLng')
  .arcColor('color').arcStroke(0.28)
  .arcDashLength(0.3).arcDashGap(0.1).arcDashAnimateTime(3500)
  .arcAltitudeAutoScale(0.35)
  (document.getElementById('globe-container'));

globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.4;
window.addEventListener('resize', () => { globe.width(innerWidth); globe.height(innerHeight); });

// ── Card ───────────────────────────────────────────────────────
function showCard(trip) {
  // Highlight active pin
  document.querySelectorAll('.globe-pin').forEach(p => p.classList.remove('active'));
  const pinEl = document.querySelector(`.globe-pin[data-id="${trip.id}"]`);
  if (pinEl) pinEl.classList.add('active');

  const photos = trip.photos.map((src,i) =>
    `<img class="strip-photo" src="${src}" alt="${i+1}" loading="lazy" onclick="openLightbox('${src}')">`
  ).join('');

  document.getElementById('card-content').innerHTML = `
    <span class="c-flag">${trip.flag}</span>
    <div class="c-occasion">${trip.occasion}</div>
    <div class="c-name">${trip.name}</div>
    <div class="c-route">${trip.date} &nbsp;·&nbsp; ${trip.originName} → ${trip.location}</div>
    <div class="c-story">${trip.story}</div>
    <div class="c-section">Photos</div>
    <div class="photo-strip">${photos}</div>
  `;
  document.getElementById('card').classList.add('show');
  document.getElementById('card-inner').scrollTop = 0;
  document.getElementById('hint').style.display = 'none';
  updateStepUI();
}

function closeCard() {
  document.getElementById('card').classList.remove('show');
  document.querySelectorAll('.globe-pin').forEach(p => p.classList.remove('active'));
  globe.controls().autoRotate = true;
}

// ── Journey player ─────────────────────────────────────────────
let currentIndex = 0;
let playing = true;
let stepTimer = null;
let progressTimer = null;
let progressStart = 0;

const STEP_DURATION = 7000; // ms card is shown per trip

function flyToTrip(trip, openCard) {
  globe.controls().autoRotate = false;

  // 1. Fly to origin
  globe.pointOfView({ lat: trip.originLat, lng: trip.originLng, altitude: 2.8 }, 900);

  setTimeout(() => {
    // 2. Fly to destination — tilt lat slightly up so destination clears the card
    const latOffset = 12;
    globe.pointOfView({ lat: trip.lat - latOffset, lng: trip.lng, altitude: 1.9 }, 1800);

    setTimeout(() => {
      if (openCard) showCard(trip);
    }, 1900);
  }, 1100);
}

function playStep(index) {
  if (index >= TRIPS.length) {
    // End — loop back
    index = 0;
  }
  currentIndex = index;
  const trip = TRIPS[index];

  document.getElementById('now-playing').textContent =
    `${trip.originName}  →  ${trip.name}`;

  flyToTrip(trip, true);
  startProgress();

  stepTimer = setTimeout(() => {
    if (playing) playStep(currentIndex + 1);
  }, STEP_DURATION + 3000); // card time + fly time
}

function startProgress() {
  clearInterval(progressTimer);
  progressStart = Date.now();
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => {
    fill.style.transition = `width ${STEP_DURATION + 3000}ms linear`;
    fill.style.width = '100%';
  });
}

function pauseJourney() {
  playing = false;
  clearTimeout(stepTimer); clearInterval(progressTimer);
  document.getElementById('btn-play').textContent = '▶';
  document.getElementById('progress-fill').style.transition = 'none';
}

function resumeJourney() {
  playing = true;
  document.getElementById('btn-play').textContent = '⏸';
  playStep(currentIndex);
}

function togglePlay() {
  if (playing) pauseJourney(); else resumeJourney();
}

function journeyStep(dir) {
  pauseJourney();
  currentIndex = Math.max(0, Math.min(TRIPS.length - 1, currentIndex + dir));
  playing = true;
  document.getElementById('btn-play').textContent = '⏸';
  playStep(currentIndex);
}

function updateStepUI() {
  document.getElementById('journey-step').textContent =
    `${currentIndex + 1} / ${TRIPS.length}`;
}

// Swipe to close card on mobile
let touchStartY = 0;
document.getElementById('card').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('card').addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 70 && document.getElementById('card-inner').scrollTop === 0) {
    closeCard();
    pauseJourney();
  }
}, { passive: true });

// ── Lightbox ───────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lb-img').src = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); }
});

// ── Auto-start ─────────────────────────────────────────────────
setTimeout(() => {
  document.getElementById('hint').style.display = 'none';
  playStep(0);
}, 2200);
</script>
</body>
</html>
